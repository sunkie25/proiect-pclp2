name: Build C Multi-Platform

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install GLUT (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get install -y freeglut3-dev

    - name: Install GLUT (Windows)
      if: matrix.os == 'windows-latest'
      run: vcpkg install freeglut:x64-windows

    - name: Compile (Windows)
      if: matrix.os == 'windows-latest'
      run: gcc main.c -o main.exe -IC:/vcpkg/installed/x64-windows/include -LC:/vcpkg/installed/x64-windows/lib -lfreeglut -lopengl32 -lglu32

    - name: Copy GLUT DLL (Windows)
      if: matrix.os == 'windows-latest'
      run: copy C:\vcpkg\installed\x64-windows\bin\freeglut.dll freeglut.dll

    - name: Compile (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: gcc main.c -o main -lGL -lGLU -lglut

    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        New-Item -ItemType Directory -Force package
        Copy-Item main.exe package/
        Copy-Item freeglut.dll package/
        Copy-Item offsets.txt package/

    - name: Package (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p package
        cp main offsets.txt package/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: executabile-${{ matrix.os }}
        path: package/*
        if-no-files-found: error
